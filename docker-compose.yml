version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart_energy_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-smart_energy_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_energy}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_energy_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-smart_energy_root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-smart_energy}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_production_jwt_secret_key_2026}
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  mysql_data:
    driver: local
